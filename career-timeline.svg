<svg viewBox="0 0 1400 260" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0f1a"/>
      <stop offset="100%" stop-color="#1c2333"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="1400" height="260" rx="18" fill="url(#bg)"/>

  <!-- connecting line -->
  <line x1="150" y1="150" x2="1250" y2="150" stroke="#D97706" stroke-width="2" stroke-dasharray="6,6" opacity="0.6"/>

  <!-- Node 1: Intern -->
  <circle cx="150" cy="150" r="10" fill="#D97706"/>
  <text x="150" y="108" text-anchor="middle" font-family="Verdana, sans-serif" font-size="14" fill="#C9D3E0">Feb 2022</text>
  <text x="150" y="188" text-anchor="middle" font-family="Verdana, sans-serif" font-size="17" font-weight="bold" fill="#ffffff">Intern</text>
  <text x="150" y="210" text-anchor="middle" font-family="Verdana, sans-serif" font-size="12" fill="#8b96a8">
    <tspan x="150" dy="0">Built DAPI: Cart Re-targeting</tspan>
    <tspan x="150" dy="16">→ converted to full-time</tspan>
  </text>

  <!-- Node 2: SDE I -->
  <circle cx="517" cy="150" r="10" fill="#D97706"/>
  <text x="517" y="108" text-anchor="middle" font-family="Verdana, sans-serif" font-size="14" fill="#C9D3E0">Aug 2022</text>
  <text x="517" y="188" text-anchor="middle" font-family="Verdana, sans-serif" font-size="17" font-weight="bold" fill="#ffffff">SDE I</text>
  <text x="517" y="210" text-anchor="middle" font-family="Verdana, sans-serif" font-size="12" fill="#8b96a8">
    <tspan x="517" dy="0">Nevio prime booking flow</tspan>
    <tspan x="517" dy="16">−90% inventory inconsistency</tspan>
  </text>

  <!-- Node 3: SDE II -->
  <circle cx="883" cy="150" r="10" fill="#D97706"/>
  <text x="883" y="108" text-anchor="middle" font-family="Verdana, sans-serif" font-size="14" fill="#C9D3E0">Apr 2025</text>
  <text x="883" y="188" text-anchor="middle" font-family="Verdana, sans-serif" font-size="17" font-weight="bold" fill="#ffffff">SDE II</text>
  <text x="883" y="210" text-anchor="middle" font-family="Verdana, sans-serif" font-size="12" fill="#8b96a8">
    <tspan x="883" dy="0">Multi-tenant Quarkus services</tspan>
    <tspan x="883" dy="16">10M+ requests/day</tspan>
  </text>

  <!-- Node 4: Builder -->
  <circle cx="1250" cy="150" r="10" fill="#D97706"/>
  <text x="1250" y="108" text-anchor="middle" font-family="Verdana, sans-serif" font-size="14" fill="#C9D3E0">2025 — Now</text>
  <text x="1250" y="188" text-anchor="middle" font-family="Verdana, sans-serif" font-size="17" font-weight="bold" fill="#ffffff">Builder</text>
  <text x="1250" y="210" text-anchor="middle" font-family="Verdana, sans-serif" font-size="12" fill="#8b96a8">
    <tspan x="1250" dy="0">equitytale.com</tspan>
    <tspan x="1250" dy="16">designed, built &amp; shipped</tspan>
  </text>
</svg>
